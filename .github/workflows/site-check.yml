name: Site content and search checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0; existing repository pin
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2; verified upstream 2026-10-20
        with:
          bun-version: "1.4.3"
      - name: Check generated content is current
        run: bun run build:check
      - name: Test content rendering and search regressions
        run: bun test --coverage
      - name: Check search metadata, structured data, links and crawler discovery
        run: bun run check:seo
      - name: Enforce no tracking, storage, pixels or third-party automatic resources
        run: bun run check:privacy
