# sscsb: CI secret-scanning (TruffleHog only).
# Local hooks block first; this catches anything that slips past (e.g. web UI commits).
# All actions pinned to full commit SHAs (sscsb actions-audit enforces this).
#
# The Gitleaks job that `sscsb init` emits here was REMOVED (2026-09-12) for two
# independent reasons, either of which is sufficient:
#
#   1. POLICY. This repo runs a strongest-tool-only secret-detection policy:
#      `gitleaks = false` under [controls.secrets] in .sscsb/config.toml.
#      TruffleHog live-verifies a candidate credential against its issuing
#      provider, so a finding means "this key is real and active"; Gitleaks is
#      regex/entropy-only and cannot verify. Running both adds unverifiable
#      noise without adding detection strength. `sscsb init` does NOT propagate
#      that config flag into this generated workflow, so the job had to be
#      removed by hand — the config and the CI would otherwise disagree, which
#      is the split-brain the policy exists to prevent.
#   2. IT WOULD FAIL ANYWAY. `grcengineering` is a GitHub ORGANIZATION, and
#      gitleaks-action requires a paid GITLEAKS_LICENSE for org-owned repos.
#      No such secret is set on this repo, so the job would have failed on
#      every push — a permanently red check that everyone learns to ignore.
#
# If Gitleaks is ever wanted back, flip `gitleaks = true` in .sscsb/config.toml,
# re-run `sscsb init`, AND provision GITLEAKS_LICENSE — all three, or it breaks.
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (v3.95.9).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown

