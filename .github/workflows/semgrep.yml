# Semgrep Cloud Platform scan.
#
# Hardened by sscsb remediation (2026-09-12). Three findings were fixed at the
# code level rather than suppressed:
#
#   1. `actions/checkout@v4` was a MUTABLE tag ref — whoever controls that tag
#      controls this job. Now pinned to a full 40-char commit SHA
#      (tj-actions/changed-files, CVE-2025-30066, was exactly this).
#   2. checkout left the GITHUB_TOKEN on disk for every later step to read.
#      `persist-credentials: false` removes it.
#   3. The job had no egress/tamper monitoring. step-security/harden-runner is
#      now the first step.
#
# The `container: semgrep/semgrep` image was REMOVED to make (3) possible:
# harden-runner installs a monitoring agent on the runner host and does not
# support container jobs, so no ordering of steps could have satisfied it while
# the job ran inside a container. Semgrep is installed from PyPI at an exact
# pinned version instead, which also makes the analyser version auditable from
# this file rather than floating with whatever `latest` the image tag resolved
# to on the day.
#
# Scope note: measured on 2026-09-12, Semgrep reports "Ran 316 rules on 0 files"
# against index.html — its JS rules bind to .js/.ts extensions and do not read
# inline <script> blocks out of HTML. This workflow therefore covers the
# workflow/config surface, NOT the application JavaScript. Coverage of the
# inline JS is CodeQL's javascript-typescript matrix entry in codeql.yml, which
# does extract it. Keep both.
on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
    - main
    - master
    paths:
    - .github/workflows/semgrep.yml
  schedule:
  # random HH:MM to avoid a load spike on GitHub Actions at 00:00
  - cron: 4 7 * * *
name: Semgrep

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: '3.12'
    - name: Install Semgrep (pinned)
      # Exact version pin, no floating range: the analyser version is auditable
      # from this file. Bumped by Renovate like any other pinned dependency.
      run: pip install semgrep==1.176.0
    - name: Run semgrep ci
      run: semgrep ci
